<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
  <title id="title">Flowchart Recording Gudang Umum SIGMA</title>
  <desc id="desc">Alur menu Recording GU untuk penerimaan supplier, penerimaan transfer, pengeluaran BPB, pengembalian, dan stok.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.node{stroke:#334155;stroke-width:2.5}.proc{fill:#eaf1ff}.io{fill:#e8f7f3}.decision{fill:#fff4d6}.terminal{fill:#e5f4df}.body{font-size:18px}.label{font-size:16px;font-weight:700;fill:#334155}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="1120" fill="#fff"/>
  <text x="700" y="45" text-anchor="middle" class="title">Recording Gudang Umum — Alur Menu Operasional</text>
  <text x="700" y="73" text-anchor="middle" class="sub">Pencatatan kejadian fisik dan serah-terima data untuk pemeriksaan Admin GU</text>
  <ellipse cx="700" cy="120" rx="100" ry="34" class="node terminal"/><text x="700" y="127" text-anchor="middle" class="body">Mulai / Login</text>
  <path d="M700 154 V185" class="line"/>
  <polygon points="550,195 850,195 830,255 530,255" class="node io"/><text x="680" y="232" text-anchor="middle" class="body">Menu: Dashboard Tugas Harian</text>
  <path d="M680 255 V285" class="line"/>
  <polygon points="680,285 820,340 680,395 540,340" class="node decision"/><text x="680" y="347" text-anchor="middle" class="body">Pilih menu</text>
  <path d="M540 340 H235 V440" class="line"/><path d="M650 390 L680 440" class="line"/><path d="M820 340 H1120 V440" class="line"/>
