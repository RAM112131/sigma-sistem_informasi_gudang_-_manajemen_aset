  <rect x="500" y="610" width="240" height="105" rx="8" class="node proc"/><text x="620" y="646" text-anchor="middle" class="body"><tspan x="620">Isi peminta, barang,</tspan><tspan x="620" dy="24">jumlah, dan pemakai</tspan></text>
  <rect x="790" y="610" width="240" height="105" rx="8" class="node proc"/><text x="910" y="646" text-anchor="middle" class="body"><tspan x="910">Pilih pinjaman/sisa;</tspan><tspan x="910" dy="24">catat jumlah kembali</tspan></text>
  <path d="M620 715 V755" class="line"/><path d="M910 715 V755" class="line"/>
  <rect x="500" y="755" width="240" height="85" rx="8" class="node proc"/><text x="620" y="790" text-anchor="middle" class="body"><tspan x="620">Simpan BPB</tspan><tspan x="620" dy="24">menunggu verifikasi</tspan></text>
  <rect x="790" y="755" width="240" height="85" rx="8" class="node proc"/><text x="910" y="802" text-anchor="middle" class="body">Simpan pengembalian</text>
  <path d="M620 840 V880" class="line"/><path d="M910 840 V880" class="line"/>
  <polygon points="620,880 740,930 620,980 500,930" class="node decision"/><text x="620" y="937" text-anchor="middle" class="body">Keputusan Admin GU</text>
  <path d="M500 930 H465 V1020" class="line"/><path d="M740 930 H770 V1020" class="line"/>
  <text x="430" y="1005" class="label">Ditolak</text><text x="750" y="1005" class="label">Disahkan</text>
  <polygon points="365,1020 565,1020 545,1085 345,1085" class="node io"/><text x="455" y="1060" text-anchor="middle" class="body">Tinjau alasan</text>
  <polygon points="670,1020 870,1020 850,1085 650,1085" class="node io"/><text x="760" y="1060" text-anchor="middle" class="body">Stok diperbarui</text>
  <rect x="1080" y="440" width="240" height="100" rx="8" class="node proc"/><text x="1200" y="478" text-anchor="middle" class="body"><tspan x="1200">Lihat saldo stok</tspan><tspan x="1200" dy="24">dan kartu stok</tspan></text>
  <path d="M1200 540 V585" class="line"/>
  <polygon points="1090,585 1310,585 1290,655 1070,655" class="node io"/><text x="1190" y="627" text-anchor="middle" class="body">Saldo operasional terkini</text>
</svg>
