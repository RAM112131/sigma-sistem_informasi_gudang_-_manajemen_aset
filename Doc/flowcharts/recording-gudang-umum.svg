  <polygon points="235,440 350,490 235,540 120,490" class="node decision"/><text x="235" y="497" text-anchor="middle" class="body">Asal barang?</text>
  <path d="M120 490 H95 V570" class="line"/><path d="M350 490 H385 V570" class="line"/>
  <text x="60" y="555" class="label">Supplier</text><text x="370" y="555" class="label">Transfer Store</text>
  <rect x="25" y="570" width="220" height="105" rx="8" class="node proc"/><text x="135" y="606" text-anchor="middle" class="body"><tspan x="135">Isi supplier, dokumen,</tspan><tspan x="135" dy="24">barang, qty, kondisi</tspan></text>
  <rect x="275" y="570" width="220" height="105" rx="8" class="node proc"/><text x="385" y="606" text-anchor="middle" class="body"><tspan x="385">Cocokkan barang fisik</tspan><tspan x="385" dy="24">dengan dokumen transfer</tspan></text>
  <path d="M135 675 V715" class="line"/><path d="M385 675 V715" class="line"/>
  <polygon points="135,715 245,760 135,805 25,760" class="node decision"/><text x="135" y="767" text-anchor="middle" class="body">Data valid?</text>
  <polygon points="385,715 495,760 385,805 275,760" class="node decision"/><text x="385" y="767" text-anchor="middle" class="body">Cocok?</text>
  <path d="M25 760 H10 V625 H25" class="line"/><text x="10" y="830" class="label">Tidak: koreksi</text>
  <path d="M245 760 H260 V850" class="line"/><text x="250" y="745" class="label">Ya</text>
  <path d="M275 760 H260 V850" class="line"/><text x="270" y="745" class="label">Tidak: tindak lanjuti</text>
  <path d="M495 760 H510 V625 H495" class="line"/>
  <rect x="145" y="850" width="230" height="85" rx="8" class="node proc"/><text x="260" y="885" text-anchor="middle" class="body"><tspan x="260">Simpan penerimaan</tspan><tspan x="260" dy="24">/ konfirmasi transfer</tspan></text>
  <path d="M260 935 V970" class="line"/>
  <polygon points="145,970 395,970 375,1035 125,1035" class="node io"/><text x="260" y="1010" text-anchor="middle" class="body">Stok unit / transfer diperbarui</text>
  <path d="M680 440 V485" class="line"/>
  <polygon points="680,485 795,535 680,585 565,535" class="node decision"/><text x="680" y="542" text-anchor="middle" class="body">Jenis transaksi?</text>
