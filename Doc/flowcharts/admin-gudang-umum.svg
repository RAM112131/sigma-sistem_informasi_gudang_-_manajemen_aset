<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Flowchart Admin Gudang Umum SIGMA</title>
  <desc id="desc">Alur Admin GU untuk mengajukan permintaan ke Store, melihat stok fisik, dan membuka master barang.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.node{stroke:#334155;stroke-width:2.5}.proc{fill:#eaf1ff}.io{fill:#e8f7f3}.decision{fill:#fff4d6}.terminal{fill:#e5f4df}.body{font-size:17px}.label{font-size:15px;font-weight:700;fill:#334155}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#fff"/>
  <text x="600" y="45" text-anchor="middle" class="title">Admin Gudang Umum — Alur Menu dan Operasional</text>
  <text x="600" y="73" text-anchor="middle" class="sub">Permintaan barang ke Store, stok fisik unit, dan master barang</text>
  <ellipse cx="600" cy="120" rx="100" ry="32" class="node terminal"/><text x="600" y="126" text-anchor="middle" class="body">Mulai / Login</text>
  <path d="M600 152 V180" class="line"/>
  <polygon points="470,190 730,190 710,250 450,250" class="node io"/><text x="590" y="226" text-anchor="middle" class="body">Menu: Dashboard Admin GU</text>
  <path d="M590 250 V280" class="line"/>
  <polygon points="590,280 720,330 590,380 460,330" class="node decision"/><text x="590" y="337" text-anchor="middle" class="body">Pilih menu</text>
  <path d="M460 330 H190 V410" class="line"/><path d="M590 380 V410" class="line"/><path d="M720 330 H1010 V410" class="line"/>
  <text x="110" y="398" class="label">Permintaan Barang ke Store</text><text x="545" y="398" class="label">Stok Barang Fisik</text><text x="930" y="398" class="label">Master Barang</text>
  <rect x="55" y="410" width="270" height="78" rx="8" class="node proc"/><text x="190" y="440" text-anchor="middle" class="body"><tspan x="190">Pilih barang, jumlah,</tspan><tspan x="190" dy="23">dan gudang tujuan</tspan></text>
  <path d="M190 488 V520" class="line"/>
  <polygon points="190,520 290,565 190,610 90,565" class="node decision"/><text x="190" y="572" text-anchor="middle" class="body">Data valid?</text>
  <path d="M90 565 H35 V449 H55" class="line"/><text x="20" y="630" class="label">Tidak: perbaiki</text>
  <path d="M290 565 H345 V650" class="line"/><text x="303" y="552" class="label">Ya</text>
  <polygon points="225,650 465,650 445,715 205,715" class="node io"/><text x="335" y="690" text-anchor="middle" class="body">Ajukan; Store menerima antrean</text>
  <path d="M335 715 V740" class="line"/>
  <polygon points="335,740 440,785 335,830 230,785" class="node decision"/><text x="335" y="792" text-anchor="middle" class="body">Hasil Store?</text>
  <path d="M230 785 H130 V850" class="line"/><path d="M440 785 H535 V850" class="line"/>
  <text x="78" y="840" class="label">Ditolak</text><text x="475" y="840" class="label">Dikirim</text>
  <polygon points="20,850 240,850 225,895 5,895" class="node io"/><text x="120" y="879" text-anchor="middle" class="body">Tinjau status/riwayat</text>
  <polygon points="410,850 660,850 645,895 395,895" class="node io"/><text x="535" y="879" text-anchor="middle" class="body">Recording GU menerima fisik</text>
  <rect x="480" y="440" width="220" height="85" rx="8" class="node proc"/><text x="590" y="475" text-anchor="middle" class="body"><tspan x="590">Lihat saldo stok</tspan><tspan x="590" dy="24">atau kartu stok</tspan></text>
  <rect x="900" y="440" width="220" height="85" rx="8" class="node proc"/><text x="1010" y="475" text-anchor="middle" class="body"><tspan x="1010">Cari atau kelola</tspan><tspan x="1010" dy="24">katalog barang</tspan></text>
  <path d="M590 525 V565" class="line"/><path d="M1010 525 V565" class="line"/>
  <polygon points="490,565 690,565 675,620 475,620" class="node io"/><text x="585" y="600" text-anchor="middle" class="body">Tinjau persediaan unit</text>
  <polygon points="910,565 1110,565 1095,620 895,620" class="node io"/><text x="1005" y="600" text-anchor="middle" class="body">Perubahan katalog tersimpan</text>
</svg>
