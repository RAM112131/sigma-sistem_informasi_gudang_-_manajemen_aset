<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Flowchart Super Admin SIGMA</title>
  <desc id="desc">Alur Super Admin dari login, dashboard, pengelolaan akses dan gudang, hingga pemantauan audit.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.node{stroke:#334155;stroke-width:2.5}.proc{fill:#eaf1ff}.io{fill:#e8f7f3}.decision{fill:#fff4d6}.terminal{fill:#e5f4df}.label{font-size:16px;font-weight:700;fill:#334155}.body{font-size:18px}.small{font-size:16px}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="980" fill="#fff"/>
  <text x="600" y="46" text-anchor="middle" class="title">Super Admin — Alur Menu dan Tindakan</text>
  <text x="600" y="74" text-anchor="middle" class="sub">Akses sistem, struktur gudang, master barang, dan pengawasan</text>
  <ellipse cx="600" cy="125" rx="100" ry="34" class="node terminal"/>
  <text x="600" y="132" text-anchor="middle" class="body">Mulai / Login</text>
  <path d="M600 159 V194" class="line"/>
  <polygon points="470,205 730,205 710,265 450,265" class="node io"/>
  <text x="590" y="242" text-anchor="middle" class="body">Menu: Dashboard</text>
  <path d="M590 265 V304" class="line"/>
  <polygon points="590,305 735,365 590,425 445,365" class="node decision"/>
  <text x="590" y="372" text-anchor="middle" class="body">Pilih menu</text>
  <path d="M445 365 H150 V465" class="line"/>
  <path d="M515 395 L390 465" class="line"/>
  <path d="M665 395 L810 465" class="line"/>
  <path d="M735 365 H1050 V465" class="line"/>
  <text x="235" y="351" class="label">Kelola User</text>
  <text x="420" y="433" class="label">Role &amp; Permission</text>
  <text x="740" y="433" class="label">Master Gudang / Barang</text>
  <text x="965" y="351" class="label">Pengawasan</text>
  <rect x="45" y="465" width="210" height="100" rx="8" class="node proc"/>
  <text x="150" y="505" text-anchor="middle" class="body"><tspan x="150">Tambah / ubah</tspan><tspan x="150" dy="25">/ nonaktifkan user</tspan></text>
  <rect x="285" y="465" width="210" height="100" rx="8" class="node proc"/>
  <text x="390" y="505" text-anchor="middle" class="body"><tspan x="390">Atur role dan</tspan><tspan x="390" dy="25">permission</tspan></text>
  <rect x="705" y="465" width="210" height="100" rx="8" class="node proc"/>
  <text x="810" y="505" text-anchor="middle" class="body"><tspan x="810">Kelola gudang</tspan><tspan x="810" dy="25">dan master barang</tspan></text>
  <rect x="945" y="465" width="210" height="100" rx="8" class="node proc"/>
  <text x="1050" y="505" text-anchor="middle" class="body"><tspan x="1050">Periksa dashboard</tspan><tspan x="1050" dy="25">dan log audit</tspan></text>
  <path d="M150 565 V620 H390" class="line"/>
  <path d="M390 565 V620" class="line"/>
  <path d="M810 565 V620 H610" class="line"/>
  <path d="M1050 565 V620 H810" class="line"/>
  <rect x="390" y="620" width="420" height="75" rx="8" class="node io"/>
  <text x="600" y="665" text-anchor="middle" class="body">Hasil pengelolaan tersimpan / aktivitas tercatat</text>
  <path d="M810 657 H900 V740" class="line"/>
  <polygon points="900,740 1030,795 900,850 770,795" class="node decision"/>
  <text x="900" y="802" text-anchor="middle" class="body">Perlu tindak lanjut?</text>
  <path d="M770 795 H600 V720" class="line"/>
  <text x="674" y="779" class="label">Ya — kembali ke menu</text>
  <path d="M1030 795 H1100 V905 H700" class="line"/>
  <text x="1045" y="780" class="label">Tidak</text>
  <polygon points="600,870 820,870 800,925 580,925" class="node io"/>
  <text x="690" y="905" text-anchor="middle" class="body">Tinjau / ekspor log</text>
  <path d="M580 897 H500" class="line"/>
  <ellipse cx="420" cy="897" rx="80" ry="34" class="node terminal"/>
  <text x="420" y="904" text-anchor="middle" class="body">Selesai</text>
</svg>
