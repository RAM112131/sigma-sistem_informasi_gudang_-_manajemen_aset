<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280" role="img" aria-labelledby="title desc">
  <title id="title">Flowchart Admin Gudang Store SIGMA</title>
  <desc id="desc">Alur menu Store, penerimaan supplier, stok, permintaan unit, pemindahan dan pengiriman.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.node{stroke:#334155;stroke-width:2.5}.proc{fill:#eaf1ff}.io{fill:#e8f7f3}.decision{fill:#fff4d6}.terminal{fill:#e5f4df}.body{font-size:18px}.label{font-size:16px;font-weight:700;fill:#334155}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="1280" fill="#fff"/>
  <text x="700" y="45" text-anchor="middle" class="title">Admin Gudang Store — Alur Menu dan Distribusi</text>
  <text x="700" y="73" text-anchor="middle" class="sub">Stok pusat → pemenuhan permintaan → pengiriman → penerimaan unit</text>
  <ellipse cx="700" cy="120" rx="100" ry="34" class="node terminal"/><text x="700" y="127" text-anchor="middle" class="body">Mulai / Login</text>
  <path d="M700 154 V185" class="line"/>
  <polygon points="560,195 840,195 820,255 540,255" class="node io"/><text x="690" y="232" text-anchor="middle" class="body">Menu: Dashboard Store</text>
  <path d="M690 255 V285" class="line"/>
  <polygon points="690,285 825,340 690,395 555,340" class="node decision"/><text x="690" y="347" text-anchor="middle" class="body">Pilih menu</text>
  <path d="M555 340 H170 V440" class="line"/><path d="M640 386 L500 440" class="line"/><path d="M740 386 L900 440" class="line"/><path d="M825 340 H1230 V440" class="line"/>
  <text x="195" y="326" class="label">Stok</text><text x="420" y="420" class="label">Penerimaan Barang</text><text x="820" y="420" class="label">Pengeluaran Barang</text><text x="1155" y="326" class="label">Laporan</text>
  <rect x="60" y="440" width="220" height="95" rx="8" class="node proc"/><text x="170" y="478" text-anchor="middle" class="body"><tspan x="170">Lihat stok / kartu</tspan><tspan x="170" dy="25">stok / impor awal</tspan></text>
  <rect x="390" y="440" width="220" height="95" rx="8" class="node proc"/><text x="500" y="478" text-anchor="middle" class="body"><tspan x="500">Catat barang dari</tspan><tspan x="500" dy="25">supplier</tspan></text>
  <polygon points="1120,440 1340,440 1320,535 1100,535" class="node io"/><text x="1220" y="480" text-anchor="middle" class="body"><tspan x="1220">Lihat / ekspor</tspan><tspan x="1220" dy="25">laporan (jika berhak)</tspan></text>
  <path d="M500 535 V590" class="line"/>
  <polygon points="390,590 610,590 590,665 370,665" class="node io"/><text x="490" y="635" text-anchor="middle" class="body">Penerimaan tersimpan; stok bertambah</text>
  <path d="M900 440 V480" class="line"/>
  <polygon points="790,480 1010,480 990,540 770,540" class="node io"/><text x="890" y="518" text-anchor="middle" class="body">Tab: Permintaan / Pemindahan / Histori</text>
  <path d="M890 540 V575" class="line"/>
  <polygon points="890,575 1010,625 890,675 770,625" class="node decision"/><text x="890" y="632" text-anchor="middle" class="body">Pilih pekerjaan</text>
  <path d="M770 625 H690 V715" class="line"/><path d="M890 675 V715" class="line"/><path d="M1010 625 H1110 V715" class="line"/>
  <text x="655" y="700" class="label">Permintaan</text><text x="910" y="700" class="label">Pemindahan langsung</text><text x="1075" y="700" class="label">Histori</text>
  <rect x="570" y="715" width="240" height="80" rx="8" class="node proc"/><text x="690" y="750" text-anchor="middle" class="body"><tspan x="690">Tinjau permintaan</tspan><tspan x="690" dy="24">dari Admin GU</tspan></text>
  <rect x="840" y="715" width="240" height="80" rx="8" class="node proc"/><text x="960" y="750" text-anchor="middle" class="body"><tspan x="960">Pilih tujuan, barang,</tspan><tspan x="960" dy="24">dan jumlah</tspan></text>
  <polygon points="1110,715 1330,715 1310,795 1090,795" class="node io"/><text x="1210" y="762" text-anchor="middle" class="body">Tinjau dokumen/status</text>
  <path d="M690 795 V825 H825" class="line"/><path d="M960 795 V825" class="line"/>
  <polygon points="825,825 965,880 825,935 685,880" class="node decision"/><text x="825" y="887" text-anchor="middle" class="body">Dapat dipenuhi?</text>
  <path d="M685 880 H510 V950" class="line"/><path d="M825 935 V950" class="line"/>
  <text x="550" y="920" class="label">Tidak — tolak</text><text x="845" y="922" class="label">Ya</text>
  <polygon points="390,950 610,950 590,1015 370,1015" class="node io"/><text x="490" y="990" text-anchor="middle" class="body">Status ditolak tercatat</text>
  <rect x="700" y="950" width="250" height="65" rx="8" class="node proc"/><text x="825" y="990" text-anchor="middle" class="body">Alokasikan &amp; buat transfer</text>
  <path d="M825 1015 V1045" class="line"/>
  <polygon points="825,1045 955,1090 825,1135 695,1090" class="node decision"/><text x="825" y="1097" text-anchor="middle" class="body">Barang dikirim?</text>
  <path d="M695 1090 H640 V1050 H825" class="line"/><text x="605" y="1080" class="label">Tidak: menunggu</text>
  <path d="M955 1090 H1090" class="line"/><text x="980" y="1077" class="label">Ya</text>
  <rect x="1090" y="1045" width="250" height="75" rx="8" class="node proc"/><text x="1215" y="1075" text-anchor="middle" class="body"><tspan x="1215">Konfirmasi kirim;</tspan><tspan x="1215" dy="24">stok Store dipotong</tspan></text>
  <path d="M1215 1120 V1165 H825" class="line"/>
  <polygon points="700,1165 950,1165 930,1225 680,1225" class="node io"/><text x="815" y="1202" text-anchor="middle" class="body">Recording GU menerima barang</text>
</svg>
